name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dagger call test
        uses: dagger/dagger-for-github@v8
        with:
          version: "0.21.11"
          verb: call
          args: test
