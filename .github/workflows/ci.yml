name: ci

on:
  pull_request:
  push:
    branches: [main]

# 三个 job 并行运行，在 PR 页面上各自显示为一个检查：ci / lint、ci / test、ci / end-to-end。
# 每个 job 是一台新的 runner，各自安装 Dagger CLI；依赖缓存在 Dagger 函数内部（先装依赖再拷代码）。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=0.21.11 sudo -E sh
      - name: dagger call lint
        run: dagger call lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=0.21.11 sudo -E sh
      - name: dagger call test
        run: dagger call test

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=0.21.11 sudo -E sh
      # 先导出报告：测试失败时这一步也成功，保证报告和截图一定能拿到
      - name: dagger call end-to-end-report
        run: dagger call end-to-end-report export --path=playwright-report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # 再判定结果：和上一步输入相同，Dagger 命中缓存不会重跑测试；有用例失败时这一步变红
      - name: dagger call end-to-end
        run: dagger call end-to-end
